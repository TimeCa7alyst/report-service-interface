<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funil e Conversão de Orçamentos - AcrillService</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/relatorios.css">
</head>
<body data-analise="conversao-orcamentos">

<div class="app-container">
    <div class="alert" id="alert-card" style="display: none;" role="alert">
        <div class="alert-content">
            <i class="bi bi-exclamation-triangle-fill alert-icon"></i>
            <span id="alert-text">Mensagem do sistema</span>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="http://localhost:8085/" class="logo-link">
                <img src="./assets/images/acrillogo.svg" alt="Logo AcrillService">
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="http://localhost:8085/" class="nav-item"><i class="bi bi-house-door-fill"></i><span>INÍCIO</span></a>
            <a href="http://localhost:8085/produto" class="nav-item"><i class="bi bi-box-seam-fill"></i><span>PRODUTOS</span></a>
            <a href="http://localhost:8085/venda" class="nav-item"><i class="bi bi-cart-fill"></i><span>VENDAS</span></a>
            <a href="http://localhost:8085/orcamento" class="nav-item"><i class="bi bi-file-earmark-text-fill"></i><span>ORÇAMENTOS</span></a>
            <a href="http://localhost:8085/cliente" class="nav-item"><i class="bi bi-people-fill"></i><span>CLIENTES</span></a>
            <a href="http://localhost:8085/avaliacao" class="nav-item"><i class="bi bi-star-fill"></i><span>AVALIAÇÕES</span></a>
            <a href="./index.html" class="nav-item active"><i class="bi bi-bar-chart-line-fill"></i><span>RELATÓRIOS</span></a>
            <a href="http://localhost:8081/index.html" class="nav-item"><i class="bi bi-shield-lock-fill"></i><span>SYSADMIN</span></a>
        </nav>
        <div class="sidebar-footer">
            <button type="button" id="btn-logout" class="nav-item logout-btn"><i class="bi bi-box-arrow-right"></i><span>SAIR</span></button>
        </div>
    </aside>

    <main class="main-content">
        <header class="analise-top-bar">
            <div class="analise-title-group">
                <a href="./index.html" class="btn-back"><i class="bi bi-arrow-left"></i> VOLTAR AOS RELATÓRIOS</a>
                <h1 class="analise-page-title">FUNIL E CONVERSÃO<br>DE ORÇAMENTOS</h1>
            </div>

            <!-- Split Button EXPORTAR + Dropdown PDF / XLSX -->
            <div class="export-split-wrapper" id="export-split-wrapper">
                <button type="button" class="btn-export-main" id="btn-export-executar" data-formato="pdf">
                    <i class="bi bi-download"></i>
                    <span id="export-btn-label">EXPORTAR (PDF)</span>
                </button>
                <button type="button" class="btn-export-toggle" id="btn-export-dropdown" aria-label="Escolher formato">
                    <i class="bi bi-chevron-down"></i>
                </button>

                <div class="export-dropdown-menu" id="export-dropdown-menu">
                    <button type="button" class="export-option selected" data-formato="pdf">
                        <span class="export-option-left"><i class="bi bi-file-earmark-pdf-fill"></i> Documento PDF (.pdf)</span>
                        <i class="bi bi-check2 check-icon"></i>
                    </button>
                    <button type="button" class="export-option" data-formato="excel">
                        <span class="export-option-left"><i class="bi bi-file-earmark-excel-fill"></i> Planilha Excel (.xlsx)</span>
                        <i class="bi bi-check2 check-icon" style="visibility: hidden;"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- KPIs Bicolor -->
        <section class="kpis-pill-grid" id="kpis-container"></section>

        <!-- Filtros Específicos -->
        <section class="filters-bar" id="filtros-container"></section>

        <!-- Tabela -->
        <section class="table-container">
            <table class="data-table">
                <thead id="analise-table-head"></thead>
                <tbody id="analise-table-body"></tbody>
            </table>
        </section>
    </main>
</div>

<script type="module" src="./assets/js/relatorios/main.js"></script>
</body>
</html>
